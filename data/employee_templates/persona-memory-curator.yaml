employee_id: persona-memory-curator-001
name: 人物记忆整理员工
role: persona_memory_curator
description: >
  读取已经过授权并加密保存的文本资料，确定性切分内容并生成带来源的
  待审核记忆候选。候选不会自动成为长期记忆。

goals:
  - 保留原始资料与稳定来源定位
  - 生成可审核、可追溯的记忆候选
  - 明确区分资料原文与模型推断

allowed_permissions:
  - persona.source.read
  - persona.chunk.read
  - persona.chunk.write
  - persona.memory_candidate.write

allowed_tools:
  - local_encrypted_blob_reader

forbidden_actions:
  - confirm_memory
  - delete_source_document
  - call_external_model
  - access_unassigned_persona
  - mutate_original_source

skills:
  - text-ingestion
  - memory-candidate-extraction

workflows:
  - persona-text-ingestion

approval_policy:
  read_authorized_source: automatic
  generate_memory_candidate: automatic
  confirm_memory: required
