name: project-daily-brief
version: 1.1.0
description: 根据仓库、开放 Issue 和开放 PR 生成有证据链接的项目工作简报。

input_schema:
  repository_snapshot: object

inputs:
  - repository_snapshot

required_permissions:
  - github.repository.read

required_tools:
  - github_repository_reader

timeout_seconds: 60
risk_level: low
requires_confirmation: true

retry_policy:
  max_attempts: 2
  backoff_seconds: 0.5
  retry_on:
    - transient_runtime_error

steps:
  - summarize_repository_activity
  - identify_active_pull_requests
  - identify_risks_and_blockers
  - recommend_next_actions
  - attach_evidence

output_schema:
  repository: string
  summary: string
  health: object
  highlights: array
  risks: array
  recommended_actions: array
  evidence: array

evaluation:
  - required_section_coverage
  - evidence_integrity
  - actionability

tests:
  - name: cited_daily_brief
    input_fixture: github_repository_snapshot
    assertions:
      - every_evidence_url_exists_in_snapshot
      - output_matches_schema

examples:
  - description: 为授权仓库生成只读项目简报
    input:
      repository_snapshot:
        repository: owner/repository

dependencies: []
