[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "digital-employee-mvp"
version = "0.8.0"
description = "An evidence-driven digital employee and review-first persona memory system."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "alembic>=1.13,<2",
  "cryptography>=43,<50",
  "fastapi>=0.111,<1",
  "httpx[socks]>=0.27,<1",
  "pgvector>=0.4,<1",
  "psycopg[binary]>=3.2,<4",
  "PyJWT[crypto]>=2.8,<3",
  "pydantic>=2.7,<3",
  "python-multipart>=0.0.20,<1",
  "python-dotenv>=1,<2",
  "PyYAML>=6,<7",
  "SQLAlchemy>=2,<3",
  "uvicorn[standard]>=0.30,<1",
]

[project.optional-dependencies]
dev = [
  "pytest>=7.4,<9",
  "pytest-asyncio>=0.23,<1",
  "ruff>=0.9,<1",
]

[tool.ruff]
target-version = "py311"

[tool.setuptools.packages.find]
where = ["."]
include = ["apps*", "core*", "adapters*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
