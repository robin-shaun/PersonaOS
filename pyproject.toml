[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "digital-employee-mvp"
version = "0.12.0"
description = "An evidence-driven digital employee and review-first persona memory system."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
keywords = [
  "ai-agent",
  "digital-twin",
  "human-in-the-loop",
  "long-term-memory",
  "privacy",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Framework :: FastAPI",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "alembic>=1.13,<2",
  "argon2-cffi>=25.1,<26",
  "cryptography>=43,<51",
  "fastapi>=0.111,<1",
  "httpx[socks]>=0.27,<1",
  "pgvector>=0.4,<1",
  "psycopg[binary]>=3.2,<4",
  "PyJWT[crypto]>=2.8,<3",
  "pydantic>=2.7,<3",
  "python-multipart>=0.0.20,<1",
  "python-dotenv>=1,<2",
  "PyYAML>=6,<7",
  "SQLAlchemy>=2,<3",
  "uvicorn[standard]>=0.30,<1",
]

[project.optional-dependencies]
dev = [
  "pip-audit>=2.9,<3",
  "pytest>=7.4,<10",
  "pytest-asyncio>=0.23,<2",
  "ruff>=0.9,<1",
]

[project.urls]
Documentation = "https://github.com/robin-shaun/PersonaOS#readme"
Issues = "https://github.com/robin-shaun/PersonaOS/issues"
Repository = "https://github.com/robin-shaun/PersonaOS"

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.setuptools.packages.find]
where = ["."]
include = ["apps*", "core*", "adapters*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
