[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "digital-employee-mvp"
version = "0.2.0"
description = "An evidence-driven, approval-first digital employee for GitHub project maintenance."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.111,<1",
  "httpx[socks]>=0.27,<1",
  "pydantic>=2.7,<3",
  "python-dotenv>=1,<2",
  "PyYAML>=6,<7",
  "SQLAlchemy>=2,<3",
  "uvicorn[standard]>=0.30,<1",
]

[project.optional-dependencies]
dev = [
  "pytest>=7.4,<9",
  "pytest-asyncio>=0.23,<1",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["apps*", "core*", "adapters*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
