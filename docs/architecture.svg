<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1020" viewBox="0 0 1600 1020" role="img" aria-labelledby="title description">
  <title id="title">PersonaOS 0.12.0 可信本地账户与证据架构</title>
  <desc id="description">浏览器通过本地账户、可撤销 Cookie、CSRF 和非 root Web 访问 FastAPI；应用 owner 过滤与 PostgreSQL 行级安全隔离账户，人物资料经过候选、人工确认、索引、检索和引用回答，重要操作进入审计。模型、GitHub 与未来数字人通过可替换适配器连接。</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f4f7f4"/>
      <stop offset="1" stop-color="#e6eee9"/>
    </linearGradient>
    <linearGradient id="hero" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#143c34"/>
      <stop offset="1" stop-color="#245f50"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="5" stdDeviation="6" flood-color="#16372f" flood-opacity="0.12"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,5 L0,10 z" fill="#427266"/>
    </marker>
    <style>
      .title { font: 700 34px Inter, ui-sans-serif, system-ui, sans-serif; fill: #ffffff; }
      .subtitle { font: 400 16px Inter, ui-sans-serif, system-ui, sans-serif; fill: #d9ebe5; }
      .lane-title { font: 700 14px Inter, ui-sans-serif, system-ui, sans-serif; letter-spacing: 1.6px; fill: #52736a; }
      .box-title { font: 700 18px Inter, ui-sans-serif, system-ui, sans-serif; fill: #173d34; }
      .box-copy { font: 400 13px Inter, ui-sans-serif, system-ui, sans-serif; fill: #48665e; }
      .small-title { font: 700 14px Inter, ui-sans-serif, system-ui, sans-serif; fill: #173d34; }
      .small-copy { font: 400 12px Inter, ui-sans-serif, system-ui, sans-serif; fill: #55736b; }
      .flow-num { font: 700 13px Inter, ui-sans-serif, system-ui, sans-serif; fill: #ffffff; }
      .flow-copy { font: 600 12px Inter, ui-sans-serif, system-ui, sans-serif; fill: #284f45; }
      .arrow { stroke: #427266; stroke-width: 2.2; fill: none; marker-end: url(#arrow); }
      .arrow-dashed { stroke: #73958c; stroke-width: 2; stroke-dasharray: 7 6; fill: none; marker-end: url(#arrow); }
    </style>
  </defs>

  <rect width="1600" height="1020" rx="24" fill="url(#background)"/>
  <rect x="32" y="28" width="1536" height="116" rx="20" fill="url(#hero)"/>
  <text class="title" x="72" y="78">PersonaOS · Evidence before imitation</text>
  <text class="subtitle" x="72" y="110">0.12.0 模块化单体 · 可信本地账户 · 双层 owner 隔离 · 无付费模型也可运行</text>
  <g transform="translate(1275 54)">
    <rect width="248" height="62" rx="14" fill="#ffffff" fill-opacity="0.1" stroke="#9bc8bb" stroke-opacity="0.5"/>
    <circle cx="28" cy="31" r="10" fill="#9ce0c8"/>
    <text x="50" y="27" class="subtitle" style="font-weight:700">模拟系统，不是现实本人</text>
    <text x="50" y="47" class="subtitle" style="font-size:12px">事实必须有证据；无证据即不确定</text>
  </g>

  <text class="lane-title" x="52" y="184">LOCAL INTERACTION</text>
  <g filter="url(#shadow)">
    <rect x="52" y="204" width="204" height="106" rx="16" fill="#ffffff" stroke="#b7cbc5"/>
    <text class="box-title" x="76" y="239">用户 / 审核者</text>
    <text class="box-copy" x="76" y="264">登录账户 · 创建人物 · 上传资料</text>
    <text class="box-copy" x="76" y="285">逐条确认 · 查看引用与审计</text>

    <rect x="312" y="204" width="230" height="106" rx="16" fill="#ffffff" stroke="#b7cbc5"/>
    <text class="box-title" x="336" y="239">React Web</text>
    <text class="box-copy" x="336" y="264">HttpOnly Cookie · 内存态 CSRF</text>
    <text class="box-copy" x="336" y="285">同源 /api 代理 · 不持久化凭据</text>

    <rect x="598" y="204" width="230" height="106" rx="16" fill="#ffffff" stroke="#77a598" stroke-width="2"/>
    <text class="box-title" x="622" y="239">FastAPI /api/v1</text>
    <text class="box-copy" x="622" y="264">可信会话 → owner / actor</text>
    <text class="box-copy" x="622" y="285">CSRF · Origin · 近期再认证</text>

    <rect x="884" y="204" width="230" height="106" rx="16" fill="#ffffff" stroke="#b7cbc5"/>
    <text class="box-title" x="908" y="239">持久化 Worker</text>
    <text class="box-copy" x="908" y="264">租约 · 至少一次 · 幂等</text>
    <text class="box-copy" x="908" y="285">重试 · 超时 · 协作式取消</text>
  </g>
  <path class="arrow" d="M256 257 H302"/>
  <path class="arrow" d="M542 257 H588"/>
  <path class="arrow" d="M828 257 H874"/>

  <text class="lane-title" x="52" y="356">APPLICATION CORE · REPLACEABLE BOUNDARIES</text>
  <g filter="url(#shadow)">
    <rect x="52" y="378" width="1062" height="326" rx="20" fill="#ffffff" stroke="#a9c1ba"/>

    <rect x="78" y="414" width="232" height="112" rx="14" fill="#eef6f2" stroke="#b4cec5"/>
    <text class="box-title" x="98" y="447">Account / Persona Identity</text>
    <text class="box-copy" x="98" y="472">Argon2id · 会话 · owner · 模拟声明</text>
    <text class="box-copy" x="98" y="493">权限 · 敏感等级 · 模型数据策略</text>

    <rect x="336" y="414" width="232" height="112" rx="14" fill="#eef6f2" stroke="#b4cec5"/>
    <text class="box-title" x="356" y="447">Knowledge Ingestion</text>
    <text class="box-copy" x="356" y="472">UTF-8 验证 · 内容哈希</text>
    <text class="box-copy" x="356" y="493">稳定分块 · 有来源候选</text>

    <rect x="594" y="414" width="232" height="112" rx="14" fill="#eef6f2" stroke="#b4cec5"/>
    <text class="box-title" x="614" y="447">Memory Lifecycle</text>
    <text class="box-copy" x="614" y="472">人工审核 · 不可变版本</text>
    <text class="box-copy" x="614" y="493">关系 · 导出 · 可证明删除</text>

    <rect x="852" y="414" width="232" height="112" rx="14" fill="#eef6f2" stroke="#b4cec5"/>
    <text class="box-title" x="872" y="447">Retrieval / QA</text>
    <text class="box-copy" x="872" y="472">词法 + 向量 + RRF</text>
    <text class="box-copy" x="872" y="493">结构化回答 · Citation 校验</text>

    <rect x="78" y="554" width="316" height="116" rx="14" fill="#f5f1e9" stroke="#d3c39f"/>
    <text class="box-title" x="98" y="587">Task / Workflow</text>
    <text class="box-copy" x="98" y="612">checkpoint · 审批 · 重试 · 恢复</text>
    <text class="box-copy" x="98" y="633">资料导入 · 重建索引 · 项目维护</text>

    <rect x="420" y="554" width="316" height="116" rx="14" fill="#f5f1e9" stroke="#d3c39f"/>
    <text class="box-title" x="440" y="587">Skill / Tool Runtime</text>
    <text class="box-copy" x="440" y="612">契约注册 · 岗位 allowlist · 超时</text>
    <text class="box-copy" x="440" y="633">受信代码；第三方沙箱尚未实现</text>

    <rect x="762" y="554" width="322" height="116" rx="14" fill="#f1eef6" stroke="#c7b8d7"/>
    <text class="box-title" x="782" y="587">Audit / Evidence</text>
    <text class="box-copy" x="782" y="612">TaskRun · ModelCall · RetrievalRun</text>
    <text class="box-copy" x="782" y="633">Evidence · Citation · 无正文删除墓碑</text>
  </g>

  <path class="arrow" d="M310 470 H326"/>
  <path class="arrow" d="M568 470 H584"/>
  <path class="arrow" d="M826 470 H842"/>
  <path class="arrow" d="M236 526 V544"/>
  <path class="arrow" d="M578 554 V536 H710"/>
  <path class="arrow" d="M923 526 V544"/>

  <text class="lane-title" x="1160" y="184">ADAPTERS</text>
  <g filter="url(#shadow)">
    <rect x="1160" y="204" width="388" height="156" rx="18" fill="#ffffff" stroke="#b7cbc5"/>
    <text class="box-title" x="1186" y="238">Model Gateway</text>
    <text class="box-copy" x="1186" y="263">离线 rules-v1 / evidence-only（默认）</text>
    <text class="box-copy" x="1186" y="286">Hermes Runs API（专用无工具 profile）</text>
    <text class="box-copy" x="1186" y="309">未来：OpenAI-compatible / Ollama / vLLM</text>
    <rect x="1186" y="326" width="326" height="18" rx="9" fill="#e8f3ef"/>
    <text class="small-copy" x="1198" y="339">local · private_network · external 显式边界</text>

    <rect x="1160" y="390" width="388" height="124" rx="18" fill="#ffffff" stroke="#b7cbc5"/>
    <text class="box-title" x="1186" y="424">Tool Adapter</text>
    <text class="box-copy" x="1186" y="449">GitHub App：单仓库、Issues / PR 只读</text>
    <text class="box-copy" x="1186" y="472">安装令牌仅进程内缓存，不进入任务轨迹</text>
    <text class="box-copy" x="1186" y="493">当前不提供写 Issue、合并或发布工具</text>

    <rect x="1160" y="544" width="388" height="126" rx="18" fill="#fbfaf7" stroke="#cfc6b1" stroke-dasharray="7 5"/>
    <text class="box-title" x="1186" y="578">Digital Human Adapter · 扩展点</text>
    <text class="box-copy" x="1186" y="603">ASR → 文本 → TTS → 口型/表情 → 渲染</text>
    <text class="box-copy" x="1186" y="626">MVP 未实现；运行阶段仍可能持续消耗 GPU</text>
    <text class="box-copy" x="1186" y="649">接口与人物记忆核心分离</text>
  </g>
  <path class="arrow-dashed" d="M1114 460 H1140 Q1150 460 1150 448 V284 H1160"/>
  <path class="arrow-dashed" d="M1114 612 H1142 Q1150 612 1150 472 H1160"/>
  <path class="arrow-dashed" d="M1084 652 H1122 Q1150 652 1150 607 H1160"/>

  <text class="lane-title" x="52" y="752">LOCAL DATA PLANE</text>
  <g filter="url(#shadow)">
    <rect x="52" y="774" width="488" height="106" rx="16" fill="#173d34"/>
    <text class="box-title" x="78" y="808" style="fill:#ffffff">PostgreSQL 17 + pgvector</text>
    <text class="box-copy" x="78" y="833" style="fill:#d5e8e2">结构化领域记录 · 全文索引 · embedding 空间</text>
    <text class="box-copy" x="78" y="854" style="fill:#d5e8e2">Alembic · 受限 runtime role · FORCE RLS · owner 过滤</text>

    <rect x="570" y="774" width="350" height="106" rx="16" fill="#173d34"/>
    <text class="box-title" x="596" y="808" style="fill:#ffffff">Encrypted BlobStore</text>
    <text class="box-copy" x="596" y="833" style="fill:#d5e8e2">原始文件 · AES-256-GCM</text>
    <text class="box-copy" x="596" y="854" style="fill:#d5e8e2">内容寻址 · hash / AEAD 双重校验</text>

    <rect x="950" y="774" width="598" height="106" rx="16" fill="#ffffff" stroke="#b7cbc5"/>
    <text class="box-title" x="976" y="808">Local-first deployment</text>
    <text class="box-copy" x="976" y="833">Compose：db + API + Worker + Web；端口只绑定回环地址</text>
    <text class="box-copy" x="976" y="854">SQLite：应用隔离测试，无 RLS；本地认证不是公网身份平台</text>
  </g>
  <path class="arrow" d="M394 704 V752 Q394 764 382 764 V774"/>
  <path class="arrow" d="M710 704 V764 H710 V774"/>
  <path class="arrow" d="M923 704 V746 Q923 764 905 764 H524 V774"/>

  <g transform="translate(52 922)">
    <text class="lane-title" x="0" y="-14">EVIDENCE LOOP</text>
    <g transform="translate(0 0)">
      <circle cx="18" cy="18" r="18" fill="#276c59"/><text class="flow-num" x="14" y="23">1</text>
      <text class="flow-copy" x="44" y="23">原始资料</text>
    </g>
    <path class="arrow" d="M138 18 H164"/>
    <g transform="translate(174 0)">
      <circle cx="18" cy="18" r="18" fill="#276c59"/><text class="flow-num" x="14" y="23">2</text>
      <text class="flow-copy" x="44" y="23">稳定分块</text>
    </g>
    <path class="arrow" d="M312 18 H338"/>
    <g transform="translate(348 0)">
      <circle cx="18" cy="18" r="18" fill="#276c59"/><text class="flow-num" x="14" y="23">3</text>
      <text class="flow-copy" x="44" y="23">候选</text>
    </g>
    <path class="arrow" d="M456 18 H482"/>
    <g transform="translate(492 0)">
      <circle cx="18" cy="18" r="18" fill="#9a6b20"/><text class="flow-num" x="14" y="23">4</text>
      <text class="flow-copy" x="44" y="23">人工确认</text>
    </g>
    <path class="arrow" d="M632 18 H658"/>
    <g transform="translate(668 0)">
      <circle cx="18" cy="18" r="18" fill="#276c59"/><text class="flow-num" x="14" y="23">5</text>
      <text class="flow-copy" x="44" y="23">不可变版本</text>
    </g>
    <path class="arrow" d="M826 18 H852"/>
    <g transform="translate(862 0)">
      <circle cx="18" cy="18" r="18" fill="#276c59"/><text class="flow-num" x="14" y="23">6</text>
      <text class="flow-copy" x="44" y="23">混合检索</text>
    </g>
    <path class="arrow" d="M1000 18 H1026"/>
    <g transform="translate(1036 0)">
      <circle cx="18" cy="18" r="18" fill="#276c59"/><text class="flow-num" x="14" y="23">7</text>
      <text class="flow-copy" x="44" y="23">引用回答</text>
    </g>
    <path class="arrow" d="M1174 18 H1200"/>
    <g transform="translate(1210 0)">
      <circle cx="18" cy="18" r="18" fill="#276c59"/><text class="flow-num" x="14" y="23">8</text>
      <text class="flow-copy" x="44" y="23">审计 / 修正 / 删除</text>
    </g>
  </g>
</svg>
