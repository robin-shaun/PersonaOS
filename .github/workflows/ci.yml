name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend, migrations, and release gate
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: .python-version
          cache: pip
          cache-dependency-path: requirements-dev.lock

      - name: Install locked dependencies
        run: |
          python -m pip install --index-url https://pypi.org/simple --require-hashes -r requirements-dev.lock
          python -m pip install --index-url https://pypi.org/simple --no-deps --no-build-isolation -e .

      - name: Check Python
        run: |
          ruff check adapters apps core examples migrations scripts tests
          pytest -q

      - name: Verify API and release artifacts
        run: |
          python scripts/export_openapi.py --check
          python scripts/release_check.py

      - name: Audit Python runtime dependencies
        run: pip-audit --require-hashes -r requirements.lock

      - name: Verify SQLite migrations
        env:
          DIGITAL_EMPLOYEE_AUTO_CREATE_SCHEMA: "false"
          DIGITAL_EMPLOYEE_DATABASE_URL: sqlite:///${{ runner.temp }}/personaos-migration.db
        run: |
          alembic upgrade head
          alembic check
          alembic downgrade base
          alembic upgrade head

      - name: Compile PostgreSQL migration SQL
        env:
          DIGITAL_EMPLOYEE_AUTO_CREATE_SCHEMA: "false"
          DIGITAL_EMPLOYEE_DATABASE_URL: postgresql+psycopg://personaos:personaos@127.0.0.1:5432/personaos
        run: |
          alembic upgrade head --sql > "${RUNNER_TEMP}/postgresql-migrations.sql"
          test -s "${RUNNER_TEMP}/postgresql-migrations.sql"

  web:
    name: Web tests, build, and audit
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/web
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install locked dependencies
        run: npm ci

      - name: Test and build
        run: |
          npm test
          npm run build

      - name: Audit npm dependencies
        run: npm audit --audit-level=high

  compose-smoke:
    name: PostgreSQL, worker, API, and Web smoke
    needs:
      - backend
      - web
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Validate Compose model
        run: docker compose config --quiet

      - name: Build pinned images
        run: docker compose build --pull

      - name: Start clean stack
        run: docker compose up --detach --wait --wait-timeout 180

      - name: Bootstrap isolated smoke accounts
        env:
          PERSONAOS_SMOKE_ADMIN_PASSWORD: compose-smoke-admin-password-123
          PERSONAOS_SMOKE_MEMBER_PASSWORD: compose-smoke-member-password-123
        run: |
          printf '%s\n' "${PERSONAOS_SMOKE_ADMIN_PASSWORD}" | docker compose exec -T api python -m apps.admin create-account --username smoke-admin --display-name "Smoke Admin" --role admin --password-stdin
          printf '%s\n' "${PERSONAOS_SMOKE_MEMBER_PASSWORD}" | docker compose exec -T api python -m apps.admin create-account --username smoke-member --display-name "Smoke Member" --role member --password-stdin

      - name: Exercise the evidence loop through Web origin
        env:
          PERSONAOS_SMOKE_ADMIN_PASSWORD: compose-smoke-admin-password-123
          PERSONAOS_SMOKE_MEMBER_PASSWORD: compose-smoke-member-password-123
        run: python3 examples/compose_smoke.py

      - name: Verify PostgreSQL owner row security
        run: >-
          docker compose exec -T api
          python examples/postgres_rls_smoke.py
          --owner-a smoke-admin
          --owner-b smoke-member

      - name: Capture service logs on failure
        if: failure()
        run: docker compose logs --no-color

      - name: Remove ephemeral CI data
        if: always()
        run: docker compose down --volumes --remove-orphans
