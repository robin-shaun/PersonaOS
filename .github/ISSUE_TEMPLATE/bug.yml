name: 缺陷报告
description: 报告可复现、且不包含私密资料或安全细节的问题
title: "[Bug] "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        请勿粘贴真实人物资料、密钥、访问令牌或未公开漏洞。安全问题请使用
        Security Advisory。
  - type: input
    id: version
    attributes:
      label: PersonaOS 版本或 commit
      placeholder: v0.11.0 或完整 commit SHA
    validations:
      required: true
  - type: dropdown
    id: deployment
    attributes:
      label: 运行方式
      options:
        - Docker Compose
        - SQLite 主机模式
        - 开发模式
        - 其他
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: 最小复现
      description: 使用虚构数据描述命令、输入、预期结果和实际结果。
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: 已脱敏日志
      render: shell
  - type: checkboxes
    id: privacy
    attributes:
      label: 隐私确认
      options:
        - label: 我已移除人物资料、密钥、令牌和其他敏感信息。
          required: true
